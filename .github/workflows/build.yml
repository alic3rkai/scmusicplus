name: Build

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build-rootless:
    runs-on: macos-13
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4

      - name: Checkout theos/theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout SDKs
        uses: actions/checkout@v4
        with:
          repository: xybp888/iOS-SDKs
          ref: master
          sparse-checkout: iPhoneOS15.5.sdk
          path: theos/sdks

      - name: Install dependencies
        run: brew install make xz ldid dpkg

      - name: Build package (.deb)
        run: THEOS=theos gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Extract .app from .deb
        run: |
          mkdir -p Payload
          dpkg-deb -xv packages/*.deb Payload/
          cd Payload/Applications
          APP_NAME=$(ls -d *.app | head -n 1)
          cd ../..
          zip -r9 ${APP_NAME}.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scmusicplus (rootless)
          path: '*.ipa'
